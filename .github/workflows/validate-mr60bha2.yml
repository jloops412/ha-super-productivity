name: Validate MR60BHA2 ESPHome component

on:
  push:
    branches:
      - mr60bha2-v0.1.0
    paths:
      - "esphome/**"
      - ".github/workflows/validate-mr60bha2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          python -m pip install esphome
          esphome version

      - name: Validate YAML and component schema
        run: esphome config esphome/tests/mmwave1-test.yaml

      - name: Compile ESP32-C6 firmware
        run: esphome compile esphome/tests/mmwave1-test.yaml
