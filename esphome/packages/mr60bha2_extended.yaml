      name: "Radar Firmware Project"
    firmware_major:
      name: "Radar Firmware Major"
    firmware_sub:
      name: "Radar Firmware Subversion"
    firmware_modified:
      name: "Radar Firmware Modification"
    packet_rate:
      name: "Radar Packet Rate"
    phase_packet_rate:
      name: "Phase Packet Rate"
    target_packet_rate:
      name: "Tracked Target Packet Rate"
    point_cloud_packet_rate:
      name: "Point Cloud Packet Rate"
    last_packet_age:
      name: "Last Radar Packet Age"
    last_phase_age:
      name: "Last Phase Packet Age"
    last_target_age:
