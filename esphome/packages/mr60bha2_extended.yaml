# MR60BHA2 extended entities package.
# Assumes the existing radar hub is id: mmwave_radar.

external_components:
  - source:
      type: git
      url: https://github.com/jloops412/ha-super-productivity
      ref: mr60bha2-v0.1.0
      path: esphome/components
    components:
      - seeed_mr60bha2

binary_sensor:
  - platform: seeed_mr60bha2
    mr60bha2_id: mmwave_radar
    radar_data_valid:
      name: "Radar Data Valid"
    vital_signs_valid:
      name: "Vital Signs Valid"
    phase_data_valid:
      name: "Phase Data Available"
    target_data_valid:
      name: "Tracked Target Data Available"
    point_cloud_data_valid:
      name: "Point Cloud Data Available"

sensor:
  - platform: seeed_mr60bha2
    mr60bha2_id: mmwave_radar
    total_phase:
      name: "Total Phase"
      filters: &fast_radar_filters
        - throttle: 250ms
    breath_phase:
      name: "Breathing Phase"
      filters: *fast_radar_filters
    heart_phase:
      name: "Heart Phase"
      filters: *fast_radar_filters
    range_flag:
      name: "Vital Range Flag"
    point_cloud_count:
      name: "Point Cloud Count"
    alternative_x:
      name: "Alternative Position X"
      filters: *fast_radar_filters
    alternative_y:
      name: "Alternative Position Y"
      filters: *fast_radar_filters
    status_code:
      name: "Radar Status Code"

    target_1_x:
      name: "Tracked Target 1 X"
      filters: *fast_radar_filters
    target_1_y:
      name: "Tracked Target 1 Y"
      filters: *fast_radar_filters
    target_1_doppler_index:
      name: "Tracked Target 1 Doppler Index"
      filters: *fast_radar_filters
    target_1_speed:
      name: "Tracked Target 1 Speed"
      filters: *fast_radar_filters
    target_1_distance:
      name: "Tracked Target 1 Distance"
      filters: *fast_radar_filters
    target_1_angle:
      name: "Tracked Target 1 Angle"
      filters: *fast_radar_filters
    target_1_cluster_id:
      name: "Tracked Target 1 Cluster ID"
      filters: *fast_radar_filters

    target_2_x:
      name: "Tracked Target 2 X"
      filters: *fast_radar_filters
    target_2_y:
      name: "Tracked Target 2 Y"
      filters: *fast_radar_filters
    target_2_doppler_index:
      name: "Tracked Target 2 Doppler Index"
      filters: *fast_radar_filters
    target_2_speed:
      name: "Tracked Target 2 Speed"
      filters: *fast_radar_filters
    target_2_distance:
      name: "Tracked Target 2 Distance"
      filters: *fast_radar_filters
    target_2_angle:
      name: "Tracked Target 2 Angle"
      filters: *fast_radar_filters
    target_2_cluster_id:
      name: "Tracked Target 2 Cluster ID"
      filters: *fast_radar_filters

    target_3_x:
      name: "Tracked Target 3 X"
      filters: *fast_radar_filters
    target_3_y:
      name: "Tracked Target 3 Y"
      filters: *fast_radar_filters
    target_3_doppler_index:
      name: "Tracked Target 3 Doppler Index"
      filters: *fast_radar_filters
    target_3_speed:
      name: "Tracked Target 3 Speed"
      filters: *fast_radar_filters
    target_3_distance:
      name: "Tracked Target 3 Distance"
      filters: *fast_radar_filters
    target_3_angle:
      name: "Tracked Target 3 Angle"
      filters: *fast_radar_filters
    target_3_cluster_id:
      name: "Tracked Target 3 Cluster ID"
      filters: *fast_radar_filters

    point_1_x:
      name: "Point Cloud Point 1 X"
      filters: *fast_radar_filters
    point_1_y:
      name: "Point Cloud Point 1 Y"
      filters: *fast_radar_filters
    point_1_doppler_index:
